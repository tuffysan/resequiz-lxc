.icon-btn{flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:rgba(17,24,39,.78);color:var(--text);font-size:20px;text-decoration:none;cursor:pointer;box-shadow:var(--shadow-soft)}
.card{position:relative;background:linear-gradient(150deg,rgba(23,32,51,.92),rgba(12,18,32,.94));border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:14px 0;box-shadow:var(--shadow-soft);overflow:hidden}.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 35%)}
.hero{text-align:center;padding:38px 24px}.hero-icon{width:86px;height:86px;margin:0 auto 14px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(145deg,rgba(124,58,237,.25),rgba(37,99,235,.14));border:1px solid rgba(167,139,250,.24);font-size:42px;box-shadow:0 14px 35px rgba(76,29,149,.18)}.hero p{max-width:650px;margin:0 auto 24px;color:var(--muted);font-size:16px}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(124,58,237,.15);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;font-size:10px;font-weight:900;letter-spacing:.14em}
.primary,.secondary,.danger{min-height:50px;border-radius:15px;padding:13px 16px;border:0;font-weight:850;font-size:15px;cursor:pointer;transition:transform .14s ease,filter .14s ease,background .14s ease,border-color .14s ease}.primary{color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));box-shadow:0 12px 30px rgba(79,70,229,.28)}.primary.xl{min-height:56px;font-size:16px}.secondary{color:var(--text);background:rgba(30,41,59,.72);border:1px solid rgba(148,163,184,.20)}.danger{color:#fecdd3;background:rgba(127,29,29,.22);border:1px solid rgba(244,63,94,.28)}.primary:hover,.secondary:hover,.danger:hover{filter:brightness(1.08)}.primary:active,.secondary:active,.danger:active,.answer:active,.category:active,.mode-card:active{transform:scale(.985)}button:disabled{opacity:.42;cursor:not-allowed;filter:none}.cta-stack{display:grid;gap:9px;max-width:440px;margin:0 auto}.cta-stack .secondary{margin:0}a.primary,a.secondary{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{margin:0;padding:17px 8px;text-align:center}.stat strong{display:block;font-size:26px;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feature-grid>div{min-height:105px;padding:14px;border-radius:17px;background:rgba(15,23,42,.68);border:1px solid var(--line)}.feature-grid span{display:block;font-size:25px;margin-bottom:8px}.feature-grid b{display:block;font-size:14px}.feature-grid small{display:block;margin-top:3px;color:var(--muted);line-height:1.35}
.setup-grid,.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-grid label{display:block;font-size:12px;font-weight:850;color:#cbd5e1}.settings-grid label span{display:block;margin:0 0 7px}.player-row{display:grid;grid-template-columns:38px 1fr 42px;gap:9px;align-items:center;margin:9px 0}.player-num{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:rgba(124,58,237,.16);border:1px solid rgba(167,139,250,.22);color:#c4b5fd;font-weight:900}.player-row input,input,select{width:100%;min-height:48px;padding:11px 13px;border-radius:13px;border:1px solid rgba(148,163,184,.22);outline:none;background:#0b1220;color:var(--text);transition:border-color .15s,box-shadow .15s}input:focus,select:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.16)}input::placeholder{color:#64748b}.remove-btn{height:40px;border-radius:12px;border:1px solid rgba(244,63,94,.24);background:rgba(127,29,29,.22);color:#fda4af;font-size:20px}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode-card{position:relative;min-height:93px;padding:15px;border-radius:17px;border:1px solid var(--line);background:rgba(15,23,42,.72);color:var(--text);text-align:left;cursor:pointer}.mode-card.active{border-color:rgba(167,139,250,.7);background:linear-gradient(145deg,rgba(124,58,237,.20),rgba(37,99,235,.10));box-shadow:inset 0 0 0 1px rgba(124,58,237,.34)}.mode-card.active::after{content:"✓";position:absolute;top:12px;right:12px;width:23px;height:23px;display:grid;place-items:center;border-radius:999px;background:#7c3aed;color:#fff;font-size:12px;font-weight:900}.mode-card strong{display:block;padding-right:28px;font-size:14px}.mode-card small{display:block;margin-top:5px;color:var(--muted);line-height:1.35}
.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.category{position:relative;display:flex;align-items:center;gap:11px;min-height:65px;padding:11px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(15,23,42,.66);color:var(--text);text-align:left;cursor:pointer}.category.active{border-color:rgba(124,58,237,.72);background:rgba(124,58,237,.14);box-shadow:inset 0 0 0 1px rgba(124,58,237,.24)}.category.active::after{content:"✓";margin-left:auto;width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:#7c3aed;font-size:11px;font-weight:900}.category .emoji{font-size:24px}.category b{font-size:13px}.category small{color:var(--muted);font-size:11px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.switchrow:last-child{border-bottom:0}.switch{flex:0 0 auto;width:52px;height:30px;padding:3px;border:0;border-radius:999px;background:#334155;cursor:pointer}.switch::after{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:.18s}.switch.on{background:linear-gradient(90deg,#7c3aed,#2563eb)}.switch.on::after{transform:translateX(22px)}
.game-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.turn-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(124,58,237,.12);border:1px solid rgba(167,139,250,.2);color:#ddd6fe;font-size:12px;font-weight:900}.progress{height:6px;margin:14px 0 6px;border-radius:999px;background:rgba(148,163,184,.13);overflow:hidden}.progress>div{height:100%;border-radius:inherit;background:linear-gradient(90deg,#06b6d4,#7c3aed,#2563eb);transition:width .3s ease}.question-media{min-height:128px;margin:15px 0;display:grid;place-items:center;padding:18px;border-radius:20px;background:linear-gradient(145deg,rgba(15,23,42,.95),rgba(30,41,59,.72));border:1px solid var(--line);font-size:70px;text-align:center}.question-media .symbol{font-size:86px}.question-media .mini{font-size:20px}.question{max-width:800px;margin:18px 0 20px;font-size:clamp(22px,5vw,34px);line-height:1.18;letter-spacing:-.025em;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{position:relative;min-height:78px;padding:14px 15px;border-radius:17px;border:1px solid rgba(148,163,184,.20);background:rgba(15,23,42,.78);color:var(--text);font-size:15px;font-weight:760;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}.answer:hover{border-color:rgba(167,139,250,.45);background:rgba(30,41,59,.95)}.answer span{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:8px;border-radius:9px;background:rgba(124,58,237,.15);color:#c4b5fd;font-weight:950}.answer.selected{outline:3px solid rgba(96,165,250,.55);border-color:#60a5fa;background:rgba(37,99,235,.12)}.answer.correct{background:rgba(22,101,52,.32);border-color:rgba(34,197,94,.75)}.answer.wrong{background:rgba(127,29,29,.30);border-color:rgba(239,68,68,.72)}.answer.hidden-answer{visibility:hidden}.feedback{margin-top:14px;padding:15px 16px;border-radius:16px;background:rgba(15,23,42,.75);border:1px solid var(--line);line-height:1.5}.feedback.good{background:rgba(20,83,45,.26);border-color:rgba(34,197,94,.45)}.feedback.bad{background:rgba(127,29,29,.24);border-color:rgba(239,68,68,.42)}
.timer-wrap{min-width:62px;text-align:right}.timer{font-size:25px;font-weight:950;letter-spacing:-.04em}.timer.danger{color:#f87171;animation:pulse .65s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.powerbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.power{min-height:43px;border-radius:13px;border:1px solid var(--line);background:rgba(30,41,59,.78);color:#fff;font-size:12px;font-weight:800}.power.used{opacity:.35;text-decoration:line-through}.score-strip{display:flex;gap:8px;overflow:auto;padding:1px 1px 4px;scrollbar-width:none}.score-strip::-webkit-scrollbar{display:none}.score-pill{flex:0 0 auto;min-width:128px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(15,23,42,.70)}.score-pill.current{border-color:rgba(6,182,212,.55);background:rgba(6,182,212,.09)}.score-pill b,.score-pill span{display:block}.score-pill b{font-size:13px}.score-pill span{margin-top:3px;color:var(--muted);font-size:11px}
.winner{text-align:center;padding:34px 20px}.trophy{font-size:70px;filter:drop-shadow(0 14px 20px rgba(245,158,11,.18))}.leaderboard{display:grid;gap:8px}.rank-row,.player-live{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:12px;border-radius:15px;background:rgba(15,23,42,.72);border:1px solid var(--line)}.rank{font-size:22px;text-align:center}.points{font-weight:950}.confetti{font-size:25px;letter-spacing:6px}.party-card{text-align:center;padding:30px 20px}.party-card .party-icon{font-size:64px}.party-prompt{margin:20px 0;font-size:clamp(22px,5vw,32px);line-height:1.24;font-weight:900}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}.mini-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(15,23,42,.72);font-size:12px;color:#cbd5e1}.mini-pill input{width:auto;min-height:auto;accent-color:#7c3aed}.toast{position:fixed;left:50%;bottom:24px;z-index:99;transform:translateX(-50%);padding:11px 16px;border-radius:999px;background:#111827;border:1px solid rgba(148,163,184,.24);box-shadow:var(--shadow);font-weight:800}
.footer{text-align:center;padding:20px 0 0;color:#64748b;font-size:11px}.room-code{margin:8px 0;font-size:clamp(42px,12vw,68px);letter-spacing:.16em;font-weight:950;text-align:center;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}.player-live{display:flex;justify-content:space-between;grid-template-columns:none;margin:7px 0}.host-tag{display:inline-flex;margin-left:5px;padding:3px 6px;border-radius:999px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.2);color:#fcd34d;font-size:9px;font-weight:900;letter-spacing:.08em}.online-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.join-row{display:grid;gap:9px}.statusline{text-align:center;color:var(--muted);font-size:13px}.answer-status{text-align:center;color:var(--muted);font-size:12px}.correct-answer{margin:12px 0;padding:15px 16px;border-radius:16px;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.22)}.copybtn{display:block;width:100%;max-width:300px;margin:9px auto 0}.connection{font-size:11px;font-weight:800;white-space:nowrap}.connection.good{color:#86efac}.connection.bad{color:#fca5a5}
.portal{max-width:920px;margin:0 auto;padding:8px 0}.portal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.portal-card{display:flex;flex-direction:column;min-height:260px;padding:24px}.portal-card .big{width:56px;height:56px;display:grid;place-items:center;margin-bottom:10px;border-radius:17px;background:rgba(124,58,237,.12);font-size:28px}.portal-card h2{font-size:25px;margin:6px 0 8px}.portal-card p{flex:1;margin:0 0 16px;color:var(--muted)}.portal-card .primary{width:100%}.online-dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.10)}.install-note{margin-top:12px}.install-note .install-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.install-note .secondary{margin:0;width:100%}
@media(max-width:720px){.app-shell{padding-left:12px;padding-right:12px}.hero{padding:31px 17px}.portal-grid{grid-template-columns:1fr}.portal-card{min-height:auto}.stat-grid{grid-template-columns:1fr 1fr}.feature-grid{grid-template-columns:1fr 1fr}.setup-grid,.settings-grid{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.card{padding:16px}.question-media{min-height:110px}.install-note .install-actions{grid-template-columns:1fr}.topbar{min-height:64px}.brand h1{font-size:18px}}
@media(max-width:430px){.mode-grid,.category-grid,.feature-grid{grid-template-columns:1fr}.online-actions{grid-template-columns:1fr}.hero-icon{width:76px;height:76px;border-radius:24px;font-size:36px}.stat strong{font-size:23px}.question{font-size:23px}.answer{min-height:70px}.room-code{letter-spacing:.12em}}

/* v2.1 avatars, QR join and game-show mode */
.avatar-picker{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.avatar-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:9px}
.avatar-choice,.player-avatar-btn{border:1px solid var(--line);background:rgba(15,23,42,.82);color:#fff;cursor:pointer;transition:.15s}
.avatar-choice{aspect-ratio:1;border-radius:13px;font-size:23px}
.avatar-choice:hover,.avatar-choice.active{transform:translateY(-1px);border-color:rgba(167,139,250,.8);background:rgba(124,58,237,.18);box-shadow:0 0 0 2px rgba(124,58,237,.12)}
.avatar-player-row{grid-template-columns:48px 1fr 42px}
.player-avatar-btn{width:46px;height:46px;border-radius:14px;font-size:25px}
.avatar-inline{display:inline-grid;place-items:center;margin-right:5px}
.qr-wrap{display:flex;align-items:center;justify-content:center;gap:14px;width:min(390px,100%);margin:12px auto 4px;padding:12px;border-radius:18px;background:#fff;color:#111827;text-align:left}
.qr-wrap img{width:112px;height:112px;border-radius:8px;image-rendering:pixelated}.qr-wrap .muted{color:#64748b}
.game-show-toolbar{display:flex;justify-content:flex-end;margin:-4px -4px 3px}.game-show-full{font-size:20px}
body.game-show-mode{overflow:auto;background:#05070d}
body.game-show-mode .topbar,body.game-show-mode .footer{display:none}
body.game-show-mode .app-shell{width:100%;max-width:none;padding:0}
body.game-show-mode .online-shell,body.game-show-mode #app{width:min(1180px,100%);margin:0 auto;padding:18px}
body.game-show-mode .game-show-card{min-height:calc(100vh - 36px);display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,4vw,56px);border-radius:28px;background:radial-gradient(circle at 15% 0,rgba(124,58,237,.18),transparent 36%),linear-gradient(150deg,#101827,#090d17)}
body.game-show-mode .question{font-size:clamp(30px,5vw,62px);max-width:1050px;margin:clamp(18px,3vh,38px) 0}
body.game-show-mode .answer{min-height:clamp(82px,13vh,132px);font-size:clamp(18px,2.1vw,28px);padding:20px 24px}
body.game-show-mode .answer span{width:38px;height:38px;border-radius:12px;font-size:18px}
body.game-show-mode .question-media{min-height:170px;font-size:100px}
body.game-show-mode .question-media .symbol{font-size:120px}
body.game-show-mode .game-head{font-size:18px}
body.game-show-mode .timer{font-size:42px}
@media(max-width:560px){.avatar-grid{grid-template-columns:repeat(4,1fr)}.qr-wrap{flex-direction:column;text-align:center}.qr-wrap img{width:132px;height:132px}body.game-show-mode .online-shell,body.game-show-mode #app{padding:8px}body.game-show-mode .game-show-card{min-height:calc(100vh - 16px);padding:18px 14px;border-radius:20px}}

.achievement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.player-achievements{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}.achievement{display:flex;flex-direction:column;gap:4px;padding:10px 12px;margin:8px 0;border-radius:13px;background:rgba(124,58,237,.10);border:1px solid rgba(167,139,250,.16)}.achievement span{color:var(--muted);font-size:13px}

/* v2.3 persistent online Hall of Fame */
.hof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.hof-section{padding:12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}.hof-section h3{margin:4px 4px 10px}.achievement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.player-achievements{padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}.achievement{display:flex;flex-direction:column;gap:4px;padding:10px 12px;margin:8px 0;border-radius:13px;background:rgba(124,58,237,.10);border:1px solid rgba(167,139,250,.16)}.achievement span{color:var(--muted);font-size:13px}

.server-warning{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.09);color:#fecaca}.server-warning span{color:#fca5a5}

/* v2.4 offline installation */
.compact-hero{padding-bottom:28px}.connection-pill{font-size:12px;font-weight:800;color:var(--muted);padding:8px 11px;border:1px solid var(--line);border-radius:999px}.connection-pill.ok{color:#86efac}.connection-pill.warn{color:#fbbf24}.install-wizard{text-align:center}.offline-status{margin:14px auto 0;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:14px}.status-dot{width:9px;height:9px;border-radius:50%;background:#64748b;display:inline-block}.status-dot.good{background:var(--good);box-shadow:0 0 16px rgba(34,197,94,.45)}.status-dot.bad{background:var(--bad)}.install-grid .portal-card{min-height:300px}.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;backdrop-filter:blur(10px)}.modal-card{position:relative;width:min(620px,100%);max-height:88vh;overflow:auto}.modal-close{position:absolute;right:14px;top:14px}.guide-steps{padding-left:22px;line-height:1.65}.guide-steps li{padding:6px 0}.install-actions{display:flex;gap:10px;flex-wrap:wrap}.install-actions>*{flex:1;min-width:220px;text-align:center}

/* =========================================================
   Resequiz v2.5 — Light Professional Theme
   ========================================================= */
:root{
  --bg:#f6f7f4;
  --bg2:#eef2ef;
  --surface:#ffffff;
  --surface2:#f7f9f7;
  --surface3:#edf3f1;
  --text:#17201f;
  --muted:#65716f;
  --faint:#8b9693;
  --line:#dfe6e2;
  --accent:#176b68;
  --accent2:#245f83;
  --cyan:#3b7f8d;
  --good:#257a54;
  --bad:#b94747;
  --warn:#9a6a19;
  --radius:16px;
  --radius-sm:11px;
  --shadow:0 14px 34px rgba(34,54,50,.08);
  --shadow-soft:0 5px 18px rgba(34,54,50,.06)
}
html{background:var(--bg)}
body{
  color:var(--text);

/* ===== Resequiz v2 expansion =====
   Deterministic question generators keep the extended bank large, offline-capable
   and objectively verifiable. Every generated question gets a unique id. */
function V2Q(c,q,correct,wrong,f,d='medium',visual=''){Q(c,q,[String(correct),...wrong.map(String)],0,f,d,visual)}

}

  const d=2+(i%11), ans=3+i, n=d*ans;
  V2Q('Allmänbildning',`Vad blir ${n} ÷ ${d}?`,ans,[ans+1,ans-1,ans+d],`${n} ÷ ${d} = ${ans}.`,i<50?'easy':'medium');

    const m=String(q.a[q.r]).match(/^(-?\d+(?:[.,]\d+)?)\s*(.*)$/);

  }
}

 $('#questionCount').value=String(state.totalQuestions);$('#difficulty').value=state.difficulty;$('#timer').value=String(state.mode==='speed'?10:state.timer);if(state.mode==='speed')$('#timer').disabled=true;
 $('#questionCount').onchange=e=>state.totalQuestions=e.target.value==='all'?'all':+e.target.value;$('#difficulty').onchange=e=>state.difficulty=e.target.value;$('#timer').onchange=e=>state.timer=+e.target.value;
 $('#powerSwitch').onclick=e=>{state.powerups=!state.powerups;e.currentTarget.classList.toggle('on',state.powerups)};$('#visualSwitch').onclick=e=>{state.visual=!state.visual;e.currentTarget.classList.toggle('on',state.visual)};
 $$('.category').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;if(state.selected.includes(c)){if(state.selected.length===1)return;state.selected=state.selected.filter(x=>x!==c)}else state.selected.push(c);drawSetup()});
}
function startGame(){state.players.forEach((p,i)=>{p.avatar=p.avatar||AVATARS[i%AVATARS.length];p.name=p.name||`${state.mode==='teams'?'Lag':'Spelare'} ${i+1}`;p.score=0;p.streak=0;p.bestStreak=0;p.correct=0;p.answeredCount=0;p.categoryStats={};p.visualCorrect=0;p.visualAnswered=0;p.votes=0;p.power={fifty:false,double:false,shield:false}});state.index=0;state.currentPlayer=0;state.answered=false;state.activePower=null;if(state.mode==='party'){state.partyIndex=0;save();return renderParty()}let pool=QUIZ_QUESTIONS.filter(q=>state.selected.includes(q.c));if(state.difficulty!=='mixed')pool=pool.filter(q=>q.d===state.difficulty);if(!state.visual)pool=pool.filter(q=>!q.visual);if(pool.length<5){toast('För få frågor – blandar in fler svårighetsgrader');pool=QUIZ_QUESTIONS.filter(q=>state.selected.includes(q.c)&&(!q.visual||state.visual))}const seen=getSeenQuestions();const fresh=shuffle(pool.filter(q=>!seen.has(q.id))),oldSeen=shuffle(pool.filter(q=>seen.has(q.id)));pool=[...fresh,...oldSeen];const count=state.totalQuestions==='all'?pool.length:Math.min(+state.totalQuestions,pool.length);state.deck=pool.slice(0,count).map(q=>{const opts=shuffle(q.a.map((label,idx)=>({label,correct:idx===q.r})));return {...q,opts}});markQuestionsSeen(state.deck.map(q=>q.id));if(state.mode==='speed')state.timer=10;save();renderGame()}

function renderGame(){stopTimer();if(state.index>=state.deck.length)return renderFinal();$('#homeBtn').classList.remove('hidden');const q=state.deck[state.index],p=state.players[state.currentPlayer];state.answered=false;state.activePower=null;app.innerHTML=`<section class="card game-show-card"><div class="game-show-toolbar"><button id="fullscreenBtn" class="icon-btn game-show-full" title="Fullskärm">⛶</button></div><div class="game-head"><div><div class="turn-badge"><span class="avatar-inline">${esc(p.avatar||'😀')}</span>${state.mode==='teams'?'Lag':'Tur'}: ${esc(p.name)}</div><div class="muted" style="margin-top:7px">${esc(q.c)} · ${diffLabel(q.d)} · Fråga ${state.index+1}/${state.deck.length}</div></div>${state.timer?'<div class="timer-wrap"><div id="timer" class="timer">'+state.timer+'</div><small class="muted">sek</small></div>':''}</div><div class="progress"><div style="width:${state.index/state.deck.length*100}%"></div></div>${q.visual?`<div class="question-media"><div class="symbol">${q.visual}</div></div>`:''}<div class="question">${esc(q.q)}</div><div class="answers">${q.opts.map((o,i)=>`<button class="answer" data-answer="${i}"><span>${String.fromCharCode(65+i)}.</span>${esc(o.label)}</button>`).join('')}</div>${state.powerups?powerBar(p):''}<div id="feedback"></div></section>${scoreStrip()}`;
 $$('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));$$('[data-power]').forEach(b=>b.onclick=()=>usePower(b.dataset.power));bindFullscreen();if(state.timer)startTimer(state.timer)}
function bindFullscreen(){const b=$('#fullscreenBtn');if(!b)return;b.onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.body.classList.add('game-show-mode')}else{await document.exitFullscreen();document.body.classList.remove('game-show-mode')}}catch{document.body.classList.toggle('game-show-mode')}}}
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('game-show-mode',!!document.fullscreenElement));
function diffLabel(d){return d==='easy'?'Lätt':d==='hard'?'Svår':'Medel'}
function powerBar(p){return `<div class="powerbar"><button class="power ${p.power.fifty?'used':''}" data-power="fifty" ${p.power.fifty?'disabled':''}>✂️ 50/50</button><button class="power ${p.power.double?'used':''}" data-power="double" ${p.power.double?'disabled':''}>✖️2 Dubbla</button><button class="power ${p.power.shield?'used':''}" data-power="shield" ${p.power.shield?'disabled':''}>🛡️ Sköld</button></div>`}
function usePower(type){if(state.answered)return;const p=state.players[state.currentPlayer];if(p.power[type])return;if(type==='fifty'){const q=state.deck[state.index],wrong=q.opts.map((o,i)=>!o.correct?i:null).filter(i=>i!==null);shuffle(wrong).slice(0,2).forEach(i=>$(`[data-answer="${i}"]`).classList.add('hidden-answer'));p.power.fifty=true;toast('Två felaktiga svar borttagna')}else{state.activePower=type;p.power[type]=true;toast(type==='double'?'Nästa rätt svar ger dubbla poäng!':'Skölden räddar din streak vid fel!')}$$('[data-power]').forEach(b=>{if(b.dataset.power===type){b.disabled=true;b.classList.add('used')}});save()}
function startTimer(seconds){let left=seconds;const el=$('#timer');timerId=setInterval(()=>{left--;if(el){el.textContent=left;el.classList.toggle('danger',left<=5)}if(left<=0){stopTimer();answer(-1,0)}},1000);state.timeLeft=seconds}
function answer(idx,timeOverride){if(state.answered)return;state.answered=true;let remaining=0;if(state.timer){const el=$('#timer');remaining=timeOverride??(+el?.textContent||0)}stopTimer();const q=state.deck[state.index],p=state.players[state.currentPlayer],chosen=idx>=0?q.opts[idx]:null,correctIndex=q.opts.findIndex(o=>o.correct),buttons=$$('[data-answer]');buttons.forEach(b=>b.disabled=true);buttons[correctIndex]?.classList.add('correct');const isCorrect=!!chosen?.correct;p.answeredCount=(p.answeredCount||0)+1;p.categoryStats=p.categoryStats||{};const cs=p.categoryStats[q.c]||(p.categoryStats[q.c]={correct:0,total:0});cs.total++;if(q.visual)p.visualAnswered=(p.visualAnswered||0)+1;if(isCorrect){cs.correct++;if(q.visual)p.visualCorrect=(p.visualCorrect||0)+1;p.streak++;p.bestStreak=Math.max(p.bestStreak||0,p.streak);p.correct++;const base=q.d==='hard'?200:q.d==='medium'?150:100,streakBonus=Math.min((p.streak-1)*25,125),speedBonus=state.mode==='speed'?remaining*5:0,mult=state.activePower==='double'?2:1,gain=(base+streakBonus+speedBonus)*mult;p.score+=gain;beep(true);showFeedback(`✅ Rätt! +${gain} poäng`,q.f,true,p)}else{if(idx>=0)buttons[idx]?.classList.add('wrong');const shield=state.activePower==='shield';if(!shield)p.streak=0;beep(false);showFeedback(idx<0?'⏰ Tiden är ute!':'❌ Inte riktigt!',q.f,false,p,shield)}save()}
function showFeedback(title,text,good,p,shield=false){$('#feedback').innerHTML=`<div class="feedback ${good?'good':'bad'}"><b>${title}</b><br>${esc(text)}${good&&p.streak>=2?`<br><b>🔥 Streak ${p.streak}</b>`:''}${shield?'<br><b>🛡️ Skölden räddade din streak!</b>':''}</div><button id="next" class="primary" style="margin-top:10px">${state.index===state.deck.length-1?'Visa resultat 🏆':'Nästa fråga →'}</button>`;$('#next').onclick=nextQuestion}
function nextQuestion(){state.index++;state.currentPlayer=(state.currentPlayer+1)%state.players.length;state.answered=false;state.activePower=null;save();renderGame()}
function scoreStrip(){return `<section class="card"><div class="score-strip">${state.players.map((p,i)=>`<div class="score-pill ${i===state.currentPlayer?'current':''}"><b>${esc(p.avatar||'😀')} ${esc(p.name)}</b><span>⭐ ${p.score} · 🔥 ${p.streak} · ✅ ${p.correct}</span></div>`).join('')}</div></section>`}

function renderParty(){stopTimer();$('#homeBtn').classList.remove('hidden');if(state.partyIndex>=PARTY_PROMPTS.length)return renderPartyFinal();const prompt=PARTY_PROMPTS[state.partyIndex];app.innerHTML=`<section class="card party-card"><div class="party-icon">🎉</div><div class="eyebrow">PARTY · ${state.partyIndex+1}/${PARTY_PROMPTS.length}</div><div class="party-prompt">${esc(prompt)}</div><p class="muted">Diskutera snabbt – tryck sedan på personen som får flest röster.</p><div class="answers">${state.players.map((p,i)=>`<button class="answer" data-vote="${i}">${esc(p.avatar||'😀')} ${esc(p.name)}</button>`).join('')}</div><button id="skipParty" class="secondary">Hoppa över</button></section><section class="card"><div class="pill-row">${state.players.map(p=>`<span class="mini-pill">${esc(p.avatar||'😀')} ${esc(p.name)} · ${p.votes||0} röster</span>`).join('')}</div></section>`;$$('[data-vote]').forEach(b=>b.onclick=()=>{state.players[+b.dataset.vote].votes=(state.players[+b.dataset.vote].votes||0)+1;state.partyIndex++;save();renderParty()});$('#skipParty').onclick=()=>{state.partyIndex++;save();renderParty()}}
function renderPartyFinal(){const sorted=[...state.players].sort((a,b)=>(b.votes||0)-(a.votes||0)),top=sorted[0];app.innerHTML=`<section class="card winner"><div class="trophy">🎉</div><div class="eyebrow">PARTYKLAR</div><h2>${esc(top.name)} fick flest röster!</h2><p class="muted">Det betyder mest av allt att ${esc(top.name)} blev resans huvudperson.</p></section><section class="card"><div class="leaderboard">${sorted.map((p,i)=>`<div class="rank-row"><div class="rank">${i+1}</div><div><b>${esc(p.avatar||'😀')} ${esc(p.name)}</b></div><div class="points">${p.votes||0} röster</div></div>`).join('')}</div><button id="partyAgain" class="primary">🔁 Kör igen</button><button id="new" class="secondary">Nytt spel</button></section>`;$('#partyAgain').onclick=()=>{state.players.forEach(p=>p.votes=0);state.partyIndex=0;save();renderParty()};$('#new').onclick=renderSetup}
function playerAwards(p){const cats=Object.entries(p.categoryStats||{}).filter(([,v])=>v.total).map(([name,v])=>({name,rate:v.correct/v.total,correct:v.correct,total:v.total})).sort((a,b)=>b.rate-a.rate||b.correct-a.correct),best=cats[0],acc=p.answeredCount?Math.round(p.correct/p.answeredCount*100):0,out=[];if(best)out.push(`🎯 Bäst på ${best.name}: ${best.correct}/${best.total} (${Math.round(best.rate*100)}%)`);if(p.visualAnswered)out.push(`🖼️ Bildfrågor: ${p.visualCorrect||0}/${p.visualAnswered} (${Math.round((p.visualCorrect||0)/p.visualAnswered*100)}%)`);out.push(`🔥 Bästa streak: ${p.bestStreak||0}`);out.push(`📈 Träffsäkerhet: ${acc}%`);return out}function saveHighscores(players){let h=[];try{h=JSON.parse(localStorage.getItem('resequiz-highscores')||'[]')}catch{};for(const p of players)h.push({name:p.name,avatar:p.avatar,score:p.score,correct:p.correct,total:p.answeredCount||state.deck.length,bestStreak:p.bestStreak||0,categoryStats:p.categoryStats||{},visualCorrect:p.visualCorrect||0,visualAnswered:p.visualAnswered||0,stamp:new Date().toISOString()});h.sort((x,y)=>y.score-x.score);localStorage.setItem('resequiz-highscores',JSON.stringify(h.slice(0,100)))}function highscoreHtml(){let h=[];try{h=JSON.parse(localStorage.getItem('resequiz-highscores')||'[]')}catch{};if(!h.length)return '<p class="muted">Ingen historik ännu.</p>';const top=h.slice(0,10),cat={};for(const x of h)for(const [c,v] of Object.entries(x.categoryStats||{})){if(v.total<2)continue;const rate=v.correct/v.total;if(!cat[c]||rate>cat[c].rate)cat[c]={...v,rate,name:x.name,avatar:x.avatar}}return `<div class="achievement-grid"><div><h3>🏆 Toppresultat</h3>${top.map((x,i)=>`<div class="rank-row"><div class="rank">${i+1}</div><div><b>${esc(x.avatar||'😀')} ${esc(x.name)}</b><br><small class="muted">${x.correct}/${x.total} rätt · streak ${x.bestStreak}</small></div><div class="points">${x.score} p</div></div>`).join('')}</div><div><h3>🌟 Kategorimästare</h3>${Object.entries(cat).sort((a,b)=>b[1].rate-a[1].rate).slice(0,8).map(([c,x])=>`<div class="achievement"><b>${esc(x.avatar||'😀')} ${esc(x.name)}</b><span>${esc(c)} · ${Math.round(x.rate*100)}% (${x.correct}/${x.total})</span></div>`).join('')}</div></div>`}
function renderFinal(){stopTimer();const sorted=[...state.players].sort((a,b)=>b.score-a.score),top=sorted[0].score,winners=sorted.filter(p=>p.score===top);saveHighscores(sorted);app.innerHTML=`<section class="card winner"><div class="confetti">✨🎊✨</div><div class="trophy">🏆</div><div class="eyebrow">SPELET ÄR SLUT</div><h2>${winners.length===1?esc(winners[0].name)+' vinner!':'Det blev oavgjort!'}</h2></section><section class="card"><h3>Slutställning</h3><div class="leaderboard">${sorted.map((p,i)=>`<div class="rank-row"><div class="rank">${['🥇','🥈','🥉'][i]||i+1}</div><div><b>${esc(p.avatar||'😀')} ${esc(p.name)}</b><br><small class="muted">${p.correct} rätt · streak ${p.bestStreak||0}</small></div><div class="points">${p.score} p</div></div>`).join('')}</div></section><section class="card"><div class="eyebrow">VAD VAR NI BÄST PÅ?</div><div class="achievement-grid">${sorted.map(p=>`<div class="player-achievements"><h3>${esc(p.avatar||'😀')} ${esc(p.name)}</h3>${playerAwards(p).map(x=>`<div class="achievement">${esc(x)}</div>`).join('')}</div>`).join('')}</div></section><section class="card"><div class="eyebrow">HIGHSCORE</div>${highscoreHtml()}<button id="rematch" class="primary">🔁 Revansch</button><button id="new" class="secondary">✨ Nytt spel</button><button id="home" class="secondary">Hem</button></section>`;$('#rematch').onclick=()=>startGame();$('#new').onclick=renderSetup;$('#home').onclick=()=>{clearSave();renderStart()}}

$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'🔊':'🔇'};$('#homeBtn').onclick=()=>{stopTimer();if(confirm('Gå tillbaka till startsidan? Ditt pågående spel sparas.'))renderStart()};registerSW();renderStart();
</script>
